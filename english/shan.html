<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shan's Mission: Rapid Past Tense Sprint Quiz</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .energy-bar-wrap { height: 10px; background: #FEE2E2; border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .energy-bar-fill { height: 100%; background: linear-gradient(90deg, #EF4444, #F59E0B); width: 100%; transition: width 0.3s; }
    .badge-streak { background: #FEF2F2; color: #DC2626; border: 2px solid #FCA5A5; padding: 6px 14px; border-radius: 20px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="../index.html" class="logo-badge">
      <div class="badge-icon" style="background:#DC2626;">⚡</div>
      <div>Shan's Past Sprint</div>
    </a>
    <div class="student-tag" style="background:#FEF2F2; color:#DC2626;">Grade 6 • Shan</div>
    <div class="lang-toggle-container" style="margin-left: auto; margin-right: 12px;">
      <button class="lang-toggle-btn" onclick="window.location.href='../kelas6/shan.html'" title="Ganti ke Game Bahasa Indonesia">🇮🇩 ID</button>
      <button class="lang-toggle-btn active lang-en" title="English Mode">🇬🇧 EN</button>
    </div>

    <a href="../index.html" class="btn-back">← Main Portal</a>
  </div>

  <div class="container">
    <div class="tracker-bar">
      <div class="badge-streak">🔥 Streak: <span id="streak-num">0</span></div>
      <div class="star-count" style="color:#DC2626;">⭐ Score: <span id="score-display">0</span>/5</div>
    </div>

    <div class="energy-bar-wrap">
      <div class="energy-bar-fill" id="progress-fill"></div>
    </div>

    <div class="challenge-card" id="quiz-card">
      <div class="challenge-question" id="question-text">Loading question...</div>
      <div class="option-grid" id="options-container"></div>
      <div class="feedback-box" id="feedback-box"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn-action" id="next-btn" style="display:none; background:#DC2626;" onclick="nextQuestion()">Next Fast Challenge ⚡</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-card">
      <div style="font-size: 3.8rem; margin-bottom: 12px;">🥇 🏆 ⚡</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;">Sprint Champion, Shan!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;">
        Lightning speed and great accuracy on Simple Past Tense verbs!
      </p>
      <a href="../index.html" class="btn-action" style="margin: 0 auto; background:#DC2626;">Back to Main Portal</a>
    </div>
  </div>

  <script src="../assets/game.js"></script>
  <script>
    const questions = [
      {
        q: "What is the Simple Past (Verb 2) form of 'GO'?",
        opts: ["Went", "Goed", "Going"],
        correct: 0,
        exp: "'Go' is irregular: go -> went."
      },
      {
        q: "What is the Simple Past form of 'EAT'?",
        opts: ["Ate", "Eated", "Eating"],
        correct: 0,
        exp: "'Eat' is irregular: eat -> ate."
      },
      {
        q: "What is the Simple Past form of 'VISIT'?",
        opts: ["Visited", "Visitted", "Visit"],
        correct: 0,
        exp: "'Visit' is regular: visit + ed = visited."
      },
      {
        q: "What is the Simple Past form of 'BUY'?",
        opts: ["Bought", "Buyed", "Buying"],
        correct: 0,
        exp: "'Buy' is irregular: buy -> bought."
      },
      {
        q: "Which sentence is correctly written in Simple Past Tense?",
        opts: ["Shine visited the museum yesterday.", "Shine is visiting the museum tomorrow.", "Shine visits the museum right now."],
        correct: 0,
        exp: "'Visited' + 'yesterday' indicates Simple Past."
      }
    ];

    let qIdx = 0;
    let score = 0;
    let streak = 0;

    function renderQuestion() {
      const q = questions[qIdx];
      document.getElementById('question-text').innerText = `${qIdx + 1}. ${q.q}`;
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}.</span> ${opt}`;
        btn.onclick = () => chooseAnswer(idx);
        container.appendChild(btn);
      });
      document.getElementById('progress-fill').style.width = `${((qIdx + 1) / questions.length) * 100}%`;
    }

    function chooseAnswer(idx) {
      const q = questions[qIdx];
      const buttons = document.querySelectorAll('.btn-option');
      const feedback = document.getElementById('feedback-box');
      buttons.forEach(b => b.disabled = true);

      if (idx === q.correct) {
        playSfx('correct');
        buttons[idx].classList.add('selected-correct');
        score++;
        streak++;
        document.getElementById('score-display').innerText = score;
        document.getElementById('streak-num').innerText = streak;
        playSfx('star');
        feedback.className = "feedback-box show correct";
        feedback.innerHTML = `⚡ <b>FAST & ACCURATE!</b> ${q.exp}`;
      } else {
        playSfx('wrong');
        buttons[idx].classList.add('selected-wrong');
        streak = 0;
        document.getElementById('streak-num').innerText = streak;
        feedback.className = "feedback-box show wrong";
        feedback.innerHTML = `❌ <b>Correct answer: ${q.opts[q.correct]}</b>`;
      }
      document.getElementById('next-btn').style.display = 'inline-flex';
    }

    function nextQuestion() {
      playSfx('click');
      qIdx++;
      if (qIdx < questions.length) {
        document.getElementById('feedback-box').className = "feedback-box";
        document.getElementById('next-btn').style.display = "none";
        renderQuestion();
      } else {
        triggerGameOutcome(score, 5, "Shan", null, true);
      }
    }

    renderQuestion();
  </script>
</body>
</html>
