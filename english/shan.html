<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shan's Mission: Rapid Past Tense Sprint Quiz</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .energy-bar-wrap { height: 10px; background: #FEE2E2; border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .energy-bar-fill { height: 100%; background: linear-gradient(90deg, #EF4444, #F59E0B); width: 100%; transition: width 0.3s; }
    .badge-streak { background: #FEF2F2; color: #DC2626; border: 2px solid #FCA5A5; padding: 6px 14px; border-radius: 20px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="../index.html" class="logo-badge">
      <div class="badge-icon" style="background:#DC2626;">⚡</div>
      <div data-en="Shan's Past Sprint" data-id="Kuis Sprint Shan">Shan's Past Sprint</div>
    </a>
    <div class="lang-switch-wrap">
      <button class="btn-lang active" id="btn-lang-en" onclick="setLanguage('en')">🇬🇧 EN</button>
      <button class="btn-lang" id="btn-lang-id" onclick="setLanguage('id')">🇮🇩 ID</button>
    </div>
    <div class="student-tag" style="background:#FEF2F2; color:#DC2626;">Grade 6 • Shan</div>
    <a href="../index.html" class="btn-back" data-en="← Main Portal" data-id="← Menu Utama">← Main Portal</a>
  </div>

  <div class="container">
    <div class="tracker-bar">
      <div class="badge-streak"><span data-en="🔥 Streak: " data-id="🔥 Kombo: ">🔥 Streak: </span><span id="streak-num">0</span></div>
      <div class="star-count" style="color:#DC2626;"><span data-en="⭐ Score: " data-id="⭐ Skor: ">⭐ Score: </span><span id="score-display">0</span>/5</div>
    </div>

    <div class="energy-bar-wrap">
      <div class="energy-bar-fill" id="progress-fill"></div>
    </div>

    <div class="challenge-card" id="quiz-card">
      <div class="card-header-flex">
        <div class="challenge-question" id="question-text" style="margin-bottom:0;">Loading question...</div>
        <button class="btn-card-lang" onclick="toggleShanQuestionLang(this)">
          🌐 <span>Terjemahkan Soal</span>
        </button>
      </div>
      <div class="option-grid" id="options-container"></div>
      <div class="feedback-box" id="feedback-box"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn-action" id="next-btn" style="display:none; background:#DC2626;" onclick="nextQuestion()" data-en="Next Fast Challenge ⚡" data-id="Tantangan Kilat Berikutnya ⚡">Next Fast Challenge ⚡</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-card">
      <div style="font-size: 3.8rem; margin-bottom: 12px;">🥇 🏆 ⚡</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;" data-en="Sprint Champion, Shan!" data-id="Juara Sprint, Shan!">Sprint Champion, Shan!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;"
         data-en="Lightning speed and great accuracy on Simple Past Tense verbs!"
         data-id="Kecepatan kilat dan ketepatan tinggi dalam menaklukkan kata kerja lampau!">
        Lightning speed and great accuracy on Simple Past Tense verbs!
      </p>
      <a href="../index.html" class="btn-action" style="margin: 0 auto; background:#DC2626;" data-en="Back to Main Portal" data-id="Kembali ke Menu Utama">Back to Main Portal</a>
    </div>
  </div>

  <script src="../assets/game.js"></script>
  <script>
    const questions = [
      {
        qEn: "What is the Simple Past (Verb 2) form of 'GO'?",
        qId: "Apakah bentuk kata kerja lampau (Verb 2) dari 'GO'?",
        opts: ["Went", "Goed", "Going"],
        correct: 0,
        expEn: "'Go' is irregular: go -> went.",
        expId: "'Go' adalah kata kerja tidak beraturan: go -> went."
      },
      {
        qEn: "What is the Simple Past form of 'EAT'?",
        qId: "Apakah bentuk kata kerja lampau (Verb 2) dari 'EAT'?",
        opts: ["Ate", "Eated", "Eating"],
        correct: 0,
        expEn: "'Eat' is irregular: eat -> ate.",
        expId: "'Eat' adalah kata kerja tidak beraturan: eat -> ate."
      },
      {
        qEn: "What is the Simple Past form of 'VISIT'?",
        qId: "Apakah bentuk kata kerja lampau (Verb 2) dari 'VISIT'?",
        opts: ["Visited", "Visitted", "Visit"],
        correct: 0,
        expEn: "'Visit' is regular: visit + ed = visited.",
        expId: "'Visit' adalah kata kerja beraturan: visit + ed = visited."
      },
      {
        qEn: "What is the Simple Past form of 'BUY'?",
        qId: "Apakah bentuk kata kerja lampau (Verb 2) dari 'BUY'?",
        opts: ["Bought", "Buyed", "Buying"],
        correct: 0,
        expEn: "'Buy' is irregular: buy -> bought.",
        expId: "'Buy' adalah kata kerja tidak beraturan: buy -> bought."
      },
      {
        qEn: "Which sentence is correctly written in Simple Past Tense?",
        qId: "Kalimat manakah yang ditulis dengan Simple Past Tense secara benar?",
        opts: ["Shine visited the museum yesterday.", "Shine is visiting the museum tomorrow.", "Shine visits the museum right now."],
        correct: 0,
        expEn: "'Visited' + 'yesterday' indicates Simple Past.",
        expId: "Bentuk 'visited' dan penanda waktu 'yesterday' menunjukkan Simple Past."
      }
    ];

    let qIdx = 0;
    let score = 0;
    let streak = 0;

    function renderQuestion() {
      const q = questions[qIdx];
      const isId = window.currentLang === 'id';
      document.getElementById('question-text').innerText = `${qIdx + 1}. ${isId ? q.qId : q.qEn}`;
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}.</span> ${opt}`;
        btn.onclick = () => chooseAnswer(idx);
        container.appendChild(btn);
      });
      document.getElementById('progress-fill').style.width = `${((qIdx + 1) / questions.length) * 100}%`;
    }

    function toggleShanQuestionLang(btn) {
      playSfx('click');
      const isEn = window.currentLang !== 'id';
      window.currentLang = isEn ? 'id' : 'en';
      btn.innerHTML = isEn ? '🇬🇧 <span>English</span>' : '🌐 <span>Terjemahkan Soal</span>';
      renderQuestion();
    }

    function chooseAnswer(idx) {
      const q = questions[qIdx];
      const buttons = document.querySelectorAll('.btn-option');
      const feedback = document.getElementById('feedback-box');
      buttons.forEach(b => b.disabled = true);

      const isId = window.currentLang === 'id';
      const exp = isId ? q.expId : q.expEn;

      if (idx === q.correct) {
        playSfx('correct');
        buttons[idx].classList.add('selected-correct');
        score++;
        streak++;
        document.getElementById('score-display').innerText = score;
        document.getElementById('streak-num').innerText = streak;
        playSfx('star');
        feedback.className = "feedback-box show correct";
        feedback.innerHTML = isId ? `⚡ KILAT & TEPAT! ${exp}` : `⚡ FAST & ACCURATE! ${exp}`;
      } else {
        playSfx('wrong');
        buttons[idx].classList.add('selected-wrong');
        streak = 0;
        document.getElementById('streak-num').innerText = streak;
        feedback.className = "feedback-box show wrong";
        feedback.innerHTML = isId ? `❌ Jawaban tepat: ${q.opts[q.correct]}` : `❌ Correct answer: ${q.opts[q.correct]}`;
      }
      document.getElementById('next-btn').style.display = 'inline-flex';
    }

    function nextQuestion() {
      playSfx('click');
      qIdx++;
      if (qIdx < questions.length) {
        document.getElementById('feedback-box').className = "feedback-box";
        document.getElementById('next-btn').style.display = "none";
        renderQuestion();
      } else {
        triggerGameOutcome(score, 5, "Shan", null, true);
      }
    }

    initLanguageToggle('en');
    renderQuestion();
  </script>
</body>
</html>
