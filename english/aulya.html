<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulya's Mission: Was vs Were Past Classifier</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .card-swipe {
      background: white;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 800;
      color: #1E293B;
      line-height: 1.4;
    }
    .sort-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .btn-was {
      background: #7C3AED;
      color: white;
      border: none;
      padding: 18px;
      border-radius: var(--radius-md);
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-was:hover {
      background: #6D28D9;
      transform: translateY(-2px);
    }
    .btn-were {
      background: #0284C7;
      color: white;
      border: none;
      padding: 18px;
      border-radius: var(--radius-md);
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-were:hover {
      background: #0369A1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="../index.html" class="logo-badge">
      <div class="badge-icon" style="background:#7C3AED;">⚖️</div>
      <div data-en="Aulya's Was vs Were" data-id="Pilah Was vs Were Aulya">Aulya's Was vs Were</div>
    </a>
    <div class="lang-switch-wrap">
      <button class="btn-lang active" id="btn-lang-en" onclick="setLanguage('en')">🇬🇧 EN</button>
      <button class="btn-lang" id="btn-lang-id" onclick="setLanguage('id')">🇮🇩 ID</button>
    </div>
    <div class="student-tag" style="background:#F5F3FF; color:#7C3AED;">Grade 6 • Table 6 • Aulya</div>
    <a href="../index.html" class="btn-back" data-en="← Main Portal" data-id="← Menu Utama">← Main Portal</a>
  </div>

  <div class="container">
    <div class="tracker-bar">
      <div class="star-count" style="color:#7C3AED;"><span data-en="⭐ Score: " data-id="⭐ Skor: ">⭐ Score: </span><span id="score-display">0</span>/6</div>
      <div style="font-weight:600; color:var(--text-muted);"><span data-en="Sentence " data-id="Kalimat ">Sentence </span><span id="card-num">1</span> <span data-en="of 6" data-id="dari 6">of 6</span></div>
    </div>

    <div class="card-swipe" id="statement-box">
      <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:0.95rem; color:#64748B; font-weight:600; letter-spacing:0;"
              data-en="Choose WAS (Singular) or WERE (Plural):" data-id="Pilih WAS (Tunggal) atau WERE (Jamak):">
          Choose WAS (Singular) or WERE (Plural):
        </span>
        <button class="btn-card-lang" onclick="toggleCardLanguage('statement-box', this)">
          🌐 <span>Terjemahkan</span>
        </button>
      </div>
      <span id="sentence-text">Loading sentence...</span>
    </div>

    <div class="sort-buttons">
      <button class="btn-was" onclick="submitChoice('WAS')">
        <span>⚡ WAS</span>
        <span style="display:block; font-size:0.8rem; font-weight:600; opacity:0.9;">I, He, She, It, Nia</span>
      </button>
      <button class="btn-were" onclick="submitChoice('WERE')">
        <span>🌊 WERE</span>
        <span style="display:block; font-size:0.8rem; font-weight:600; opacity:0.9;">You, We, They, Students</span>
      </button>
    </div>

    <div class="feedback-box" id="feedback-box"></div>
    <div style="text-align: center; margin-top: 18px;">
      <button class="btn-action" id="next-btn" style="display:none; background:#7C3AED;" onclick="nextCard()" data-en="Next Sentence →" data-id="Kalimat Berikutnya →">Next Sentence →</button>
    </div>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-card">
      <div style="font-size: 3.5rem; margin-bottom: 12px;">⚖️ 🌟 👏</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;" data-en="Brilliant Classifier, Aulya!" data-id="Pemilah Hebat, Aulya!">Brilliant Classifier, Aulya!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;"
         data-en="You sorted all Was and Were past sentences with 100% accuracy and sharp grammar insight!"
         data-id="Semua kalimat lampau Was dan Were berhasil kamu pilah dengan akurasi 100% dan wawasan tata bahasa yang tajam!">
        You sorted all Was and Were past sentences with 100% accuracy and sharp grammar insight!
      </p>
      <a href="../index.html" class="btn-action" style="margin: 0 auto; background:#7C3AED;" data-en="Back to Main Portal" data-id="Kembali ke Menu Utama">Back to Main Portal</a>
    </div>
  </div>

  <script src="../assets/game.js"></script>
  <script>
    const deck = [
      {
        textEn: "Yesterday, Shan ______ sick with a fever.",
        textId: "Kemarin, Shan ______ sakit demam.",
        answer: "WAS",
        reasonEn: "Shan is singular (He), so we use WAS.",
        reasonId: "Shan adalah subjek tunggal (He), sehingga menggunakan WAS."
      },
      {
        textEn: "Last week, the 6th grade students ______ cold in the mountain.",
        textId: "Minggu lalu, para siswa kelas 6 ______ kedinginan di gunung.",
        answer: "WERE",
        reasonEn: "The students is plural (They), so we use WERE.",
        reasonId: "The students adalah subjek jamak (They), sehingga menggunakan WERE."
      },
      {
        textEn: "Nia ______ injured during gymnastics practice.",
        textId: "Nia ______ cedera saat latihan senam.",
        answer: "WAS",
        reasonEn: "Nia is singular (She), so we use WAS.",
        reasonId: "Nia adalah subjek tunggal (She), sehingga menggunakan WAS."
      },
      {
        textEn: "We ______ exhausted after the long walk.",
        textId: "Kami ______ sangat letih setelah jalan jauh.",
        answer: "WERE",
        reasonEn: "We is a first-person plural pronoun, which takes WERE.",
        reasonId: "We adalah kata ganti orang pertama jamak, menggunakan WERE."
      },
      {
        textEn: "It ______ very cold in the bedroom last night.",
        textId: "Udara ______ sangat dingin di kamar tidur tadi malam.",
        answer: "WAS",
        reasonEn: "It (singular object/weather) takes WAS.",
        reasonId: "It (subjek tunggal/kondisi cuaca) berpasangan dengan WAS."
      },
      {
        textEn: "______ you tired after school yesterday?",
        textId: "Apakah kamu letih setelah pulang sekolah kemarin?",
        answer: "WERE",
        reasonEn: "Subject 'you' always pairs with WERE in past tense.",
        reasonId: "Subjek 'you' selalu berpasangan dengan WERE dalam past tense."
      }
    ];

    let currentCardIdx = 0;
    let score = 0;

    function renderCard() {
      const card = deck[currentCardIdx];
      const isIndo = window.currentLang === 'id';
      document.getElementById('sentence-text').innerText = isIndo ? card.textId : card.textEn;
      document.getElementById('card-num').innerText = currentCardIdx + 1;
      document.getElementById('feedback-box').className = "feedback-box";
      document.getElementById('feedback-box').innerHTML = "";
      document.getElementById('next-btn').style.display = "none";
      enableButtons(true);
    }

    function submitChoice(chosen) {
      enableButtons(false);
      const card = deck[currentCardIdx];
      const isCorrect = chosen === card.answer;
      const fbox = document.getElementById('feedback-box');
      const isIndo = window.currentLang === 'id';

      if (isCorrect) {
        score++;
        playSfx('correct');
        playSfx('star');
        fbox.className = "feedback-box show correct";
        fbox.innerHTML = `✅ <strong>${chosen}</strong>! ${isIndo ? card.reasonId : card.reasonEn}`;
        document.getElementById('score-display').innerText = score;
      } else {
        playSfx('wrong');
        fbox.className = "feedback-box show wrong";
        fbox.innerHTML = `❌ Seharusnya <strong>${card.answer}</strong>. ${isIndo ? card.reasonId : card.reasonEn}`;
      }

      if (currentCardIdx < deck.length - 1) {
        document.getElementById('next-btn').style.display = "inline-flex";
      } else {
        setTimeout(showAulyaVictory, 1000);
      }
    }

    function enableButtons(enabled) {
      document.querySelectorAll('.sort-buttons button').forEach(b => b.disabled = !enabled);
    }

    function nextCard() {
      playSfx('click');
      currentCardIdx++;
      renderCard();
    }

    function showAulyaVictory() {
      playSfx('win');
      launchConfetti();
      document.getElementById('victory-modal').classList.add('active');
      if (window.PKBM_SYNC) {
        window.PKBM_SYNC.reportGameComplete(score, deck.length, 3, "Aulya mastered Was vs Were Sorter");
      }
    }

    initLanguageToggle('en');
    renderCard();
  </script>

  <!-- PKBM Universal Remote Telemetry & Live Sync Engine -->
  <script src="../assets/js/pkbm_sync.js"></script>
</body>
</html>
