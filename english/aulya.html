<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulya's Mission: Regular vs Irregular Past Verb Sorter</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .card-swipe {
      background: white;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #1E293B;
    }
    .sort-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .btn-regular {
      background: #10B981;
      color: white;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-irregular {
      background: #8B5CF6;
      color: white;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="../index.html" class="logo-badge">
      <div class="badge-icon" style="background:#8B5CF6;">⚖️</div>
      <div data-en="Aulya's Verb Sorter" data-id="Sortir Kata Kerja Aulya">Aulya's Verb Sorter</div>
    </a>
    <div class="lang-switch-wrap">
      <button class="btn-lang active" id="btn-lang-en" onclick="setLanguage('en')">🇬🇧 EN</button>
      <button class="btn-lang" id="btn-lang-id" onclick="setLanguage('id')">🇮🇩 ID</button>
    </div>
    <div class="student-tag" style="background:#F5F3FF; color:#7C3AED;">Grade 6 • Aulya</div>
    <a href="../index.html" class="btn-back" data-en="← Main Portal" data-id="← Menu Utama">← Main Portal</a>
  </div>

  <div class="container">
    <div class="tracker-bar">
      <div class="star-count" style="color:#7C3AED;"><span data-en="⭐ Score: " data-id="⭐ Skor: ">⭐ Score: </span><span id="score-display">0</span>/5</div>
      <div style="font-weight:600; color:var(--text-muted);"><span data-en="Card " data-id="Kartu ">Card </span><span id="card-num">1</span> <span data-en="of 5" data-id="dari 5">of 5</span></div>
    </div>

    <div class="card-swipe" id="statement-box">
      <span style="font-size:0.95rem; color:#64748B; font-weight:600; letter-spacing:0; margin-bottom:6px;"
            data-en="Classify this past verb:" data-id="Pilah jenis kata kerja lampau ini:">Classify this past verb:</span>
      <span id="verb-text">VISITED</span>
    </div>

    <div class="sort-buttons">
      <button class="btn-regular" onclick="submitSort('REGULAR')">
        <span data-en="📘 REGULAR (+ed)" data-id="📘 BERATURAN (+ed)">📘 REGULAR (+ed)</span>
      </button>
      <button class="btn-irregular" onclick="submitSort('IRREGULAR')">
        <span data-en="📙 IRREGULAR" data-id="📙 TIDAK BERATURAN">📙 IRREGULAR</span>
      </button>
    </div>

    <div class="feedback-box" id="feedback-box"></div>
    <div style="text-align: center; margin-top: 18px;">
      <button class="btn-action" id="next-btn" style="display:none;" onclick="nextCard()" data-en="Next Verb →" data-id="Kata Kerja Berikutnya →">Next Verb →</button>
    </div>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-card">
      <div style="font-size: 3.5rem; margin-bottom: 12px;">⚖️ 🌟 👏</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;" data-en="Brilliant Sorting, Aulya!" data-id="Sortir Hebat, Aulya!">Brilliant Sorting, Aulya!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;"
         data-en="You classified all regular and irregular past verbs with complete accuracy!"
         data-id="Semua kata kerja lampau beraturan dan tidak beraturan berhasil kamu pilah dengan tepat!">
        You classified all regular and irregular past verbs with complete accuracy!
      </p>
      <a href="../index.html" class="btn-action" style="margin: 0 auto; background:#8B5CF6;" data-en="Back to Main Portal" data-id="Kembali ke Menu Utama">Back to Main Portal</a>
    </div>
  </div>

  <script src="../assets/game.js"></script>
  <script>
    const deck = [
      { 
        verb: "VISITED", 
        type: "REGULAR", 
        reasonEn: "Formed by adding -ed to base verb 'visit'.",
        reasonId: "Dibentuk dengan menambahkan akhiran -ed pada kata dasar 'visit'."
      },
      { 
        verb: "WENT", 
        type: "IRREGULAR", 
        reasonEn: "Irregular past form of 'go' (changes form completely).",
        reasonId: "Bentuk lampau tidak beraturan dari 'go' (berubah bentuk total)."
      },
      { 
        verb: "COOKED", 
        type: "REGULAR", 
        reasonEn: "Formed by adding -ed to base verb 'cook'.",
        reasonId: "Dibentuk dengan menambahkan -ed pada kata dasar 'cook'."
      },
      { 
        verb: "BOUGHT", 
        type: "IRREGULAR", 
        reasonEn: "Irregular past form of 'buy'.",
        reasonId: "Bentuk lampau tidak beraturan dari 'buy' (membeli)."
      },
      { 
        verb: "STUDIED", 
        type: "REGULAR", 
        reasonEn: "Formed by changing 'study' (-y into -ied).",
        reasonId: "Kata beraturan: huruf 'y' berubah menjadi '-ied' (study -> studied)."
      }
    ];

    let currentIndex = 0;
    let score = 0;

    function submitSort(choice) {
      const current = deck[currentIndex];
      const feedback = document.getElementById('feedback-box');
      const nextBtn = document.getElementById('next-btn');
      const buttons = document.querySelectorAll('.sort-buttons button');
      buttons.forEach(b => b.disabled = true);

      const isId = window.currentLang === 'id';
      const reason = isId ? current.reasonId : current.reasonEn;

      if (choice === current.type) {
        playSfx('correct');
        score++;
        document.getElementById('score-display').innerText = score;
        playSfx('star');
        feedback.className = "feedback-box show correct";
        feedback.innerHTML = isId 
          ? `✅ <b>Tepat Sekali! (${current.type})</b><br>${reason}`
          : `✅ <b>Correct! (${current.type})</b><br>${reason}`;
      } else {
        playSfx('wrong');
        feedback.className = "feedback-box show wrong";
        feedback.innerHTML = isId
          ? `❌ <b>Jawaban yang benar: ${current.type}</b><br>${reason}`
          : `❌ <b>Correct Answer: ${current.type}</b><br>${reason}`;
      }
      nextBtn.style.display = "inline-flex";
    }

    function nextCard() {
      playSfx('click');
      currentIndex++;
      if (currentIndex < deck.length) {
        document.getElementById('card-num').innerText = currentIndex + 1;
        document.getElementById('verb-text').innerText = deck[currentIndex].verb;
        document.getElementById('feedback-box').className = "feedback-box";
        document.getElementById('next-btn').style.display = "none";
        document.querySelectorAll('.sort-buttons button').forEach(b => b.disabled = false);
      } else {
        triggerGameOutcome(score, 5, "Aulya", null, true);
      }
    }

    initLanguageToggle('en');
  </script>
</body>
</html>
