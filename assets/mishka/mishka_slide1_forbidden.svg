<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glowGreen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F8FAFC"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.06" stroke="#0F172A" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="720"/><line x1="40" y1="0" x2="40" y2="720"/><line x1="80" y1="0" x2="80" y2="720"/><line x1="120" y1="0" x2="120" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/><line x1="200" y1="0" x2="200" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="280" y1="0" x2="280" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="360" y1="0" x2="360" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/><line x1="440" y1="0" x2="440" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/><line x1="520" y1="0" x2="520" y2="720"/><line x1="560" y1="0" x2="560" y2="720"/><line x1="600" y1="0" x2="600" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="680" y1="0" x2="680" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="760" y1="0" x2="760" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/><line x1="840" y1="0" x2="840" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/><line x1="920" y1="0" x2="920" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1000" y1="0" x2="1000" y2="720"/><line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1080" y1="0" x2="1080" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/><line x1="1160" y1="0" x2="1160" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/><line x1="1240" y1="0" x2="1240" y2="720"/><line x1="1280" y1="0" x2="1280" y2="720"/>
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="440" x2="1280" y2="440"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="640" x2="1280" y2="640"/><line x1="0" y1="680" x2="1280" y2="680"/><line x1="0" y1="720" x2="1280" y2="720"/>
  </g>

  <!-- Top Header Pill -->
  <g transform="translate(640, 55)" text-anchor="middle">
    <rect x="-280" y="-25" width="560" height="50" rx="25" fill="#EF4444" filter="url(#shadow)"/>
    <text y="8" fill="#FFFFFF" font-size="20" font-weight="900" letter-spacing="1">
      ⚠️ JEBAKAN KLASIK DALAM MATEMATIKA ⚠️
    </text>
  </g>

  <!-- Main Card -->
  <rect x="140" y="115" width="1000" height="550" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Left: The Equation Box -->
  <g transform="translate(380, 360)">
    <!-- Equation Plate -->
    <rect x="-200" y="-140" width="400" height="280" rx="24" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3"/>

    <!-- Fractions Rendering -->
    <!-- 1/4 -->
    <text x="-120" y="-20" text-anchor="middle" font-size="54" font-weight="900" fill="#0F172A">1</text>
    <line x1="-155" y1="0" x2="-85" y2="0" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <text x="-120" y="60" text-anchor="middle" font-size="54" font-weight="900" fill="#EF4444">4</text>

    <!-- + -->
    <text x="-50" y="18" text-anchor="middle" font-size="52" font-weight="900" fill="#64748B">+</text>

    <!-- 1/6 -->
    <text x="20" y="-20" text-anchor="middle" font-size="54" font-weight="900" fill="#0F172A">1</text>
    <line x1="-15" y1="0" x2="55" y2="0" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <text x="20" y="60" text-anchor="middle" font-size="54" font-weight="900" fill="#EF4444">6</text>

    <!-- = -->
    <text x="90" y="18" text-anchor="middle" font-size="52" font-weight="900" fill="#64748B">=</text>

    <!-- 2/10 -->
    <text x="145" y="-20" text-anchor="middle" font-size="54" font-weight="900" fill="#991B1B">2</text>
    <line x1="115" y1="0" x2="175" y2="0" stroke="#991B1B" stroke-width="6" stroke-linecap="round"/>
    <text x="145" y="60" text-anchor="middle" font-size="54" font-weight="900" fill="#991B1B">10</text>

    <!-- Giant Red Cross Across 2/10 -->
    <line x1="90" y1="-80" x2="190" y2="100" stroke="#DC2626" stroke-width="12" stroke-linecap="round"/>
    <line x1="190" y1="-80" x2="90" y2="100" stroke="#DC2626" stroke-width="12" stroke-linecap="round"/>

    <!-- Red Warning Stamp -->
    <g transform="translate(0, 110) rotate(-4)">
      <rect x="-190" y="-24" width="380" height="48" rx="12" fill="#DC2626"/>
      <text y="7" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="900" letter-spacing="1">
        🚫 DILARANG DALAM MATEMATIKA! 🚫
      </text>
    </g>
  </g>

  <!-- Right: Why It's Wrong Explanation -->
  <g transform="translate(680, 190)">
    <rect width="410" height="410" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    
    <text x="205" y="45" text-anchor="middle" font-size="20" font-weight="900" fill="#0F172A">
      🤔 Kenapa Cara Ini SALAH BESAR?
    </text>

    <!-- Point 1 -->
    <g transform="translate(24, 85)">
      <circle cx="16" cy="16" r="16" fill="#FEE2E2"/>
      <text x="16" y="22" text-anchor="middle" font-size="16" font-weight="900" fill="#DC2626">1</text>
      <text x="44" y="15" font-size="15" font-weight="800" fill="#0F172A">Penyebut BUKAN Sekadar Angka</text>
      <text x="44" y="38" font-size="13.5" fill="#475569">Angka 4 &amp; 6 menunjukkan UKURAN IRISAN.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(24, 165)">
      <circle cx="16" cy="16" r="16" fill="#FEE2E2"/>
      <text x="16" y="22" text-anchor="middle" font-size="16" font-weight="900" fill="#DC2626">2</text>
      <text x="44" y="15" font-size="15" font-weight="800" fill="#0F172A">Ukuran Irisannya Tidak Sama!</text>
      <text x="44" y="38" font-size="13.5" fill="#475569">Potongan 1/4 (besar) tidak adil jika</text>
      <text x="44" y="58" font-size="13.5" fill="#475569">langsung digabung dengan 1/6 (kecil).</text>
    </g>

    <!-- Point 3: The Solution -->
    <g transform="translate(24, 265)">
      <rect x="0" y="0" width="362" height="110" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="181" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#065F46">
        💡 Solusi Keadilan: PANGGIL KPK!
      </text>
      <text x="181" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">
        KPK akan memotong kedua pizza menjadi
      </text>
      <text x="181" y="86" text-anchor="middle" font-size="15" font-weight="900" fill="#059669">
        Ukuran yang SAMA PERSIS (12 Bagian)!
      </text>
    </g>
  </g>
</svg>