<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glowGreen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#FFFDF7"/>

  <!-- Top Header Banner -->
  <g transform="translate(640, 52)" text-anchor="middle">
    <rect x="-340" y="-26" width="680" height="52" rx="26" fill="#8B5CF6" filter="url(#shadow)"/>
    <text y="9" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1">
      💎 FPB: SANG PENYEDERHANA PECAHAN RAKSASA 💎
    </text>
  </g>

  <!-- Main Comparison Area -->
  <!-- Left Box: Giant Fraction 18/24 -->
  <g transform="translate(250, 360)">
    <rect x="-180" y="-230" width="360" height="460" rx="28" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Title -->
    <rect x="-150" y="-210" width="300" height="40" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text y="-185" text-anchor="middle" font-size="16" font-weight="900" fill="#6D28D9">
      📦 Pecahan Raksasa (Angka Berat)
    </text>

    <!-- Fraction 18/24 -->
    <text y="-95" text-anchor="middle" font-size="64" font-weight="900" fill="#4C1D95">18</text>
    <line x1="-70" y1="-75" x2="70" y2="-75" stroke="#4C1D95" stroke-width="7" stroke-linecap="round"/>
    <text y="-10" text-anchor="middle" font-size="64" font-weight="900" fill="#4C1D95">24</text>

    <!-- Visual 4x6 Grid (24 blocks, 18 shaded) -->
    <g transform="translate(-108, 25)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="36" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="72" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="108" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="144" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="180" y="0" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="0" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="36" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="72" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="108" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="144" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="180" y="36" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="0" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="36" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="72" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="108" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="144" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="180" y="72" width="32" height="32" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.5"/><rect x="0" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><rect x="36" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><rect x="72" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><rect x="108" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><rect x="144" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><rect x="180" y="108" width="32" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    </g>
    <text y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#6B21A8">
      18 dari 24 kotak terisi (Terlalu rumit!)
    </text>
  </g>

  <!-- Center Laser Transformer (Divide by 6 FPB) -->
  <g transform="translate(640, 360)" text-anchor="middle">
    <!-- Flow Curves -->
    <path d="M -160 -95 Q 0 -130 160 -95" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8,6"/>
    <path d="M -160 -10 Q 0 25 160 -10" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8,6"/>

    <!-- Central Pill -->
    <rect x="-130" y="-60" width="260" height="120" rx="24" fill="#8B5CF6" filter="url(#shadow)"/>
    <text y="-25" fill="#FFFFFF" font-size="15" font-weight="800">BAGI DENGAN FPB:</text>
    <text y="15" fill="#FEF08A" font-size="34" font-weight="900">÷ 6</text>
    <text y="42" fill="#E9D5FF" font-size="13" font-weight="700">FPB(18, 24) = 6</text>

    <!-- Top & Bottom Division Badges -->
    <rect x="-70" y="-140" width="140" height="32" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text y="-119" fill="#5B21B6" font-size="14" font-weight="900">18 ÷ 6 = 3</text>

    <rect x="-70" y="70" width="140" height="32" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text y="91" fill="#5B21B6" font-size="14" font-weight="900">24 ÷ 6 = 4</text>
  </g>

  <!-- Right Box: Slim Fraction 3/4 -->
  <g transform="translate(1030, 360)">
    <rect x="-180" y="-230" width="360" height="460" rx="28" fill="#ECFDF5" stroke="#10B981" stroke-width="3.5" filter="url(#glowGreen)"/>
    
    <!-- Title -->
    <rect x="-150" y="-210" width="300" height="40" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text y="-185" text-anchor="middle" font-size="16" font-weight="900" fill="#065F46">
      ⭐ Pecahan Ramping (Paling Sederhana)
    </text>

    <!-- Fraction 3/4 -->
    <text y="-95" text-anchor="middle" font-size="72" font-weight="900" fill="#047857">3</text>
    <line x1="-60" y1="-75" x2="60" y2="-75" stroke="#047857" stroke-width="7" stroke-linecap="round"/>
    <text y="-5" text-anchor="middle" font-size="72" font-weight="900" fill="#047857">4</text>

    <!-- Visual 1x4 Bar (4 blocks, 3 shaded) -->
    <g transform="translate(-130, 45)">
      <rect x="0" y="0" width="60" height="85" rx="12" fill="#10B981" stroke="#059669" stroke-width="3"/><rect x="66" y="0" width="60" height="85" rx="12" fill="#10B981" stroke="#059669" stroke-width="3"/><rect x="132" y="0" width="60" height="85" rx="12" fill="#10B981" stroke="#059669" stroke-width="3"/><rect x="198" y="0" width="60" height="85" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
    </g>
    <text y="175" text-anchor="middle" font-size="15" font-weight="900" fill="#065F46">
      3 dari 4 bagian (Sangat Jelas &amp; Ramping!)
    </text>
    <text y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">
      Tidak bisa disederhanakan lagi!
    </text>
  </g>

  <!-- Bottom Footer Rule -->
  <g transform="translate(640, 645)" text-anchor="middle">
    <rect x="-440" y="-20" width="880" height="40" rx="20" fill="#0F172A"/>
    <text y="6" fill="#FFFFFF" font-size="14.5" font-weight="800">
      💡 TRIK KILAT KELAS 5: Langsung bagi pembilang &amp; penyebut dengan <tspan fill="#34D399">FPB</tspan> agar selesai dalam 1 langkah!
    </text>
  </g>
</svg>