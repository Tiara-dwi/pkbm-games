<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <!-- Shadows & Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="legoCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="legoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="legoAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="legoPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="goldBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#F8FAFC"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#0F172A" stroke-width="1">
    <!-- Vertical Grid lines every 40px -->
    <line x1="0" y1="0" x2="0" y2="720"/><line x1="80" y1="0" x2="80" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/><line x1="560" y1="0" x2="560" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/>
    <!-- Horizontal Grid lines every 40px -->
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="640" x2="1280" y2="640"/>
  </g>

  <!-- ==================== 1. TOP HEADER PILL ==================== -->
  <g transform="translate(640, 48)" text-anchor="middle">
    <rect x="-380" y="-24" width="760" height="48" rx="24" fill="url(#headerGrad)" filter="url(#softGlow)"/>
    <text y="7" fill="#FFFFFF" font-size="20" font-weight="900" letter-spacing="1">
      🌟 KAPSUL ALAT BANTU RAHASIA: POHON FAKTOR &amp; BILANGAN PRIMA 🌟
    </text>
  </g>

  <!-- ==================== 2. BILANGAN PRIMA (LEGO BRICK SECTION) ==================== -->
  <g transform="translate(60, 88)">
    <rect width="1160" height="110" rx="20" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Left: Definition & Badge -->
    <g transform="translate(25, 22)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#EEF2FF"/>
      <text x="85" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#4F46E5">🧱 FONDASI MATEMATIKA</text>
      
      <text x="0" y="48" font-size="18" font-weight="900" fill="#1E1B4B">Bilangan Prima = Batu Bata Lego Dasar</text>
      <text x="0" y="72" font-size="13" font-weight="600" fill="#64748B">
        Hanya bisa dibagi oleh angka 1 dan dirinya sendiri. Tidak bisa dipecah lagi!
      </text>
    </g>

    <!-- Right: Cute Colorful Lego Bricks -->
    <g transform="translate(560, 20)">
      
      <!-- Lego Brick 2 -->
      <g transform="translate(0, 0)">
        <!-- Studs on top -->
        <ellipse cx="22" cy="8" rx="10" ry="4" fill="#0284C7"/>
        <ellipse cx="48" cy="8" rx="10" ry="4" fill="#0284C7"/>
        <!-- Brick body -->
        <rect x="5" y="8" width="60" height="50" rx="8" fill="url(#legoCyan)"/>
        <rect x="7" y="10" width="56" height="6" rx="3" fill="#BAE6FD" opacity="0.6"/>
        <text x="35" y="44" text-anchor="middle" font-size="24" font-weight="900" fill="#FFFFFF">2</text>
        <text x="35" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#0284C7">PRIMA</text>
      </g>

      <!-- Lego Brick 3 -->
      <g transform="translate(100, 0)">
        <ellipse cx="22" cy="8" rx="10" ry="4" fill="#059669"/>
        <ellipse cx="48" cy="8" rx="10" ry="4" fill="#059669"/>
        <rect x="5" y="8" width="60" height="50" rx="8" fill="url(#legoGreen)"/>
        <rect x="7" y="10" width="56" height="6" rx="3" fill="#A7F3D0" opacity="0.6"/>
        <text x="35" y="44" text-anchor="middle" font-size="24" font-weight="900" fill="#FFFFFF">3</text>
        <text x="35" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#059669">PRIMA</text>
      </g>

      <!-- Lego Brick 5 -->
      <g transform="translate(200, 0)">
        <ellipse cx="22" cy="8" rx="10" ry="4" fill="#D97706"/>
        <ellipse cx="48" cy="8" rx="10" ry="4" fill="#D97706"/>
        <rect x="5" y="8" width="60" height="50" rx="8" fill="url(#legoAmber)"/>
        <rect x="7" y="10" width="56" height="6" rx="3" fill="#FDE68A" opacity="0.6"/>
        <text x="35" y="44" text-anchor="middle" font-size="24" font-weight="900" fill="#FFFFFF">5</text>
        <text x="35" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#D97706">PRIMA</text>
      </g>

      <!-- Lego Brick 7 -->
      <g transform="translate(300, 0)">
        <ellipse cx="22" cy="8" rx="10" ry="4" fill="#BE185D"/>
        <ellipse cx="48" cy="8" rx="10" ry="4" fill="#BE185D"/>
        <rect x="5" y="8" width="60" height="50" rx="8" fill="url(#legoPurple)"/>
        <rect x="7" y="10" width="56" height="6" rx="3" fill="#FBCFE8" opacity="0.6"/>
        <text x="35" y="44" text-anchor="middle" font-size="24" font-weight="900" fill="#FFFFFF">7</text>
        <text x="35" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#BE185D">PRIMA</text>
      </g>

      <!-- Dots ... -->
      <text x="395" y="48" font-size="28" font-weight="900" fill="#94A3B8">...</text>
      
      <!-- Mini Callout -->
      <g transform="translate(435, 12)">
        <rect width="140" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Setiap angka komposit</text>
        <text x="70" y="38" text-anchor="middle" font-size="11" font-weight="800" fill="#1E293B">tersusun dari prima!</text>
      </g>
    </g>
  </g>

  <!-- ==================== 3. MIDDLE SECTION: POHON FAKTOR & ATURAN KPK ==================== -->

  <!-- CARD 1: POHON FAKTOR 4 -->
  <g transform="translate(60, 218)">
    <rect width="360" height="340" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="20" y="18" width="190" height="28" rx="14" fill="#EFF6FF"/>
    <text x="115" y="37" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">🍕 Penyebut Pizza 1: Angka 4</text>

    <!-- Tree Diagram for 4 -->
    <g transform="translate(180, 75)">
      <!-- Root Node 4 -->
      <circle cx="0" cy="0" r="26" fill="#3B82F6" filter="url(#cardShadow)"/>
      <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#FFFFFF">4</text>

      <!-- Branch Lines -->
      <line x1="-15" y1="20" x2="-60" y2="65" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="20" x2="60" y2="65" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

      <!-- Left Leaf (Prime 2) -->
      <g transform="translate(-60, 85)">
        <circle cx="0" cy="0" r="24" fill="#0284C7"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2"/>
        <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">2</text>
        <rect x="-24" y="32" width="48" height="16" rx="8" fill="#E0F2FE"/>
        <text x="0" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#0369A1">PRIMA</text>
      </g>

      <!-- Right Leaf (Prime 2) -->
      <g transform="translate(60, 85)">
        <circle cx="0" cy="0" r="24" fill="#0284C7"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2"/>
        <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">2</text>
        <rect x="-24" y="32" width="48" height="16" rx="8" fill="#E0F2FE"/>
        <text x="0" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#0369A1">PRIMA</text>
      </g>
    </g>

    <!-- Bottom Result Box for 4 -->
    <g transform="translate(20, 230)">
      <rect width="320" height="90" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Faktorisasi Prima:</text>
      
      <!-- 4 = 2 x 2 = 2^2 -->
      <g transform="translate(160, 56)" text-anchor="middle">
        <text x="-80" y="6" font-size="22" font-weight="900" fill="#0F172A">4</text>
        <text x="-55" y="6" font-size="20" font-weight="700" fill="#64748B">=</text>
        <text x="-25" y="6" font-size="22" font-weight="900" fill="#0284C7">2 × 2</text>
        <text x="20" y="6" font-size="20" font-weight="700" fill="#64748B">=</text>
        
        <!-- 2^2 with exponent badge -->
        <text x="60" y="6" font-size="24" font-weight="900" fill="#15803D">2</text>
        <text x="73" y="-5" font-size="17" font-weight="900" fill="#DC2626">2</text>
        <rect x="90" y="-12" width="60" height="24" rx="6" fill="#FEF2F2" stroke="#F87171"/>
        <text x="120" y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#DC2626">PANGKAT 2</text>
      </g>
      <text x="160" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#4B5563">(Angka 2 dikalikan sebanyak 2 kali)</text>
    </g>
  </g>

  <!-- CARD 2: POHON FAKTOR 6 -->
  <g transform="translate(440, 218)">
    <rect width="360" height="340" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="20" y="18" width="190" height="28" rx="14" fill="#FAF5FF"/>
    <text x="115" y="37" text-anchor="middle" font-size="13" font-weight="800" fill="#7C3AED">🍕 Penyebut Pizza 2: Angka 6</text>

    <!-- Tree Diagram for 6 -->
    <g transform="translate(180, 75)">
      <!-- Root Node 6 -->
      <circle cx="0" cy="0" r="26" fill="#8B5CF6" filter="url(#cardShadow)"/>
      <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#FFFFFF">6</text>

      <!-- Branch Lines -->
      <line x1="-15" y1="20" x2="-60" y2="65" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="20" x2="60" y2="65" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

      <!-- Left Leaf (Prime 2) -->
      <g transform="translate(-60, 85)">
        <circle cx="0" cy="0" r="24" fill="#0284C7"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2"/>
        <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">2</text>
        <rect x="-24" y="32" width="48" height="16" rx="8" fill="#E0F2FE"/>
        <text x="0" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#0369A1">PRIMA</text>
      </g>

      <!-- Right Leaf (Prime 3) -->
      <g transform="translate(60, 85)">
        <circle cx="0" cy="0" r="24" fill="#059669"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="4 2"/>
        <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">3</text>
        <rect x="-24" y="32" width="48" height="16" rx="8" fill="#ECFDF5"/>
        <text x="0" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#047857">PRIMA</text>
      </g>
    </g>

    <!-- Bottom Result Box for 6 -->
    <g transform="translate(20, 230)">
      <rect width="320" height="90" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Faktorisasi Prima:</text>
      
      <!-- 6 = 2^1 x 3^1 -->
      <g transform="translate(160, 56)" text-anchor="middle">
        <text x="-65" y="6" font-size="22" font-weight="900" fill="#0F172A">6</text>
        <text x="-40" y="6" font-size="20" font-weight="700" fill="#64748B">=</text>
        <text x="-15" y="6" font-size="24" font-weight="900" fill="#0284C7">2</text>
        <text x="5" y="6" font-size="20" font-weight="700" fill="#64748B">×</text>
        <text x="25" y="6" font-size="24" font-weight="900" fill="#059669">3</text>
        <rect x="55" y="-12" width="75" height="24" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
        <text x="92" y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#1D4ED8">PANGKAT 1</text>
      </g>
      <text x="160" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#4B5563">(Masing-masing muncul 1 kali: 2¹ × 3¹)</text>
    </g>
  </g>

  <!-- CARD 3: ATURAN EMAS KPK (SANG PEMERSATU PENYEBUT) -->
  <g transform="translate(820, 218)">
    <rect width="400" height="340" rx="24" fill="url(#goldBox)" stroke="#F59E0B" stroke-width="2.5" filter="url(#goldGlow)"/>
    
    <!-- Header Badge -->
    <rect x="24" y="18" width="230" height="28" rx="14" fill="#B45309"/>
    <text x="139" y="37" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">👑 ATURAN EMAS MENCARI KPK</text>

    <!-- Comparison Table / Steps -->
    <g transform="translate(24, 60)">
      
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="14" cy="14" r="14" fill="#D97706"/>
        <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">1</text>
        <text x="36" y="14" font-size="13" font-weight="800" fill="#78350F">Kumpulkan SEMUA faktor prima:</text>
        <text x="36" y="30" font-size="12" font-weight="600" fill="#92400E">Ada angka <tspan font-weight="900" fill="#0284C7">2</tspan> dan angka <tspan font-weight="900" fill="#059669">3</tspan>.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="14" cy="14" r="14" fill="#D97706"/>
        <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">2</text>
        <text x="36" y="14" font-size="13" font-weight="800" fill="#78350F">Jika ada angka sama, pilih pangkat TERBESAR:</text>
        <text x="36" y="32" font-size="12" font-weight="700" fill="#B45309">
          Bandingkan: 2² vs 2¹ ➜ Pilih <tspan font-weight="900" fill="#DC2626" font-size="14">2²</tspan> (karena lebih besar)
        </text>
      </g>

      <!-- Step 3: Big Math Box -->
      <g transform="translate(0, 95)">
        <rect width="352" height="75" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
        <text x="176" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#92400E">GABUNGKAN DAN KALIKAN:</text>
        
        <g transform="translate(176, 54)" text-anchor="middle">
          <text x="-105" y="4" font-size="17" font-weight="900" fill="#78350F">KPK =</text>
          <text x="-55" y="4" font-size="24" font-weight="900" fill="#DC2626">2²</text>
          <text x="-25" y="4" font-size="20" font-weight="700" fill="#64748B">×</text>
          <text x="-5" y="4" font-size="24" font-weight="900" fill="#059669">3</text>
          <text x="25" y="4" font-size="20" font-weight="700" fill="#64748B">=</text>
          <text x="50" y="4" font-size="20" font-weight="800" fill="#0F172A">4 × 3</text>
          <text x="85" y="4" font-size="20" font-weight="700" fill="#64748B">=</text>
          <rect x="100" y="-22" width="50" height="34" rx="8" fill="#10B981"/>
          <text x="125" y="2" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">12</text>
        </g>
      </g>

      <!-- Pizza Connection Callout -->
      <g transform="translate(0, 185)">
        <rect width="352" height="48" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
        <text x="20" y="22" font-size="18">🍕</text>
        <text x="48" y="20" font-size="12" font-weight="800" fill="#991B1B">TERHUBUNG DENGAN PIZZA KITA!</text>
        <text x="48" y="36" font-size="11.5" font-weight="700" fill="#7F1D1D">
          KPK = 12 artinya kedua loyang diiris jadi 12 potong!
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== 4. BOTTOM CONTRAST BAR: KPK VS FPB ==================== -->
  <g transform="translate(60, 574)">
    <rect width="1160" height="120" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Subtitle pill on top border -->
    <g transform="translate(580, 0)" text-anchor="middle">
      <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#0F172A"/>
      <text y="5" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.5">
        ⚡ RANGKUMAN POHON FAKTOR: KPK vs FPB ⚡
      </text>
    </g>

    <!-- Left Box: KPK for Common Denominator -->
    <g transform="translate(25, 24)">
      <rect width="530" height="76" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
      <g transform="translate(18, 22)">
        <rect width="70" height="32" rx="8" fill="#2563EB"/>
        <text x="35" y="22" text-anchor="middle" font-size="15" font-weight="900" fill="#FFFFFF">KPK</text>
      </g>
      <g transform="translate(100, 20)">
        <text x="0" y="14" font-size="13" font-weight="900" fill="#1E3A8A">Ambil SEMUA faktor prima, pilih pangkat TERBESAR</text>
        <text x="0" y="34" font-size="12" font-weight="700" fill="#2563EB">
          🎯 Tugas: <tspan font-weight="800" fill="#1E293B">Menyamakan penyebut saat tambah/kurang pecahan (¼ + ⅙ ➜ per-12)</tspan>
        </text>
      </g>
    </g>

    <!-- Right Box: FPB for Simplifying Fractions -->
    <g transform="translate(585, 24)">
      <rect width="550" height="76" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
      <g transform="translate(18, 22)">
        <rect width="70" height="32" rx="8" fill="#059669"/>
        <text x="35" y="22" text-anchor="middle" font-size="15" font-weight="900" fill="#FFFFFF">FPB</text>
      </g>
      <g transform="translate(100, 20)">
        <text x="0" y="14" font-size="13" font-weight="900" fill="#064E3B">Hanya ambil faktor SAMA, pilih pangkat TERKECIL</text>
        <text x="0" y="34" font-size="12" font-weight="700" fill="#059669">
          🎯 Tugas: <tspan font-weight="800" fill="#1E293B">Menyederhanakan pecahan raksasa (¹⁸⁄₂₄ ÷ ⁶⁄₆ ➜ ¾ ramping)</tspan>
        </text>
      </g>
    </g>

  </g>

</svg>
