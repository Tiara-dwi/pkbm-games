<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glowGreen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F8FAFC"/>

  <!-- Top Header Banner -->
  <g transform="translate(640, 52)" text-anchor="middle">
    <rect x="-350" y="-26" width="700" height="52" rx="26" fill="#0F172A" filter="url(#shadow)"/>
    <text y="9" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1">
      👑 PETA STRATEGI EMAS PECAHAN &amp; GERBANG GAME 👑
    </text>
  </g>

  <!-- Card 1: Langkah 1 (KPK) -->
  <g transform="translate(360, 290)">
    <rect x="-240" y="-180" width="480" height="360" rx="28" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3.5" filter="url(#shadow)"/>
    
    <!-- Step Badge -->
    <rect x="-200" y="-160" width="400" height="44" rx="14" fill="#F59E0B"/>
    <text y="-132" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900">
      🟡 LANGKAH 1: DI AWAL SOAL
    </text>

    <!-- Condition -->
    <text y="-80" text-anchor="middle" font-size="16" font-weight="800" fill="#78350F">
      ❓ KONDISI:
    </text>
    <rect x="-180" y="-60" width="360" height="42" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
    <text y="-34" text-anchor="middle" font-size="16" font-weight="900" fill="#B45309">
      Penyebut Pecahan Masih Berbeda!
    </text>

    <!-- Action Arrow -->
    <text y="15" text-anchor="middle" font-size="28" fill="#F59E0B">⬇️</text>
    <rect x="-180" y="35" width="360" height="54" rx="16" fill="#D97706" filter="url(#glowGold)"/>
    <text y="69" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">
      👉 PANGGIL KPK!
    </text>

    <!-- Goal -->
    <text y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400E">
      Tujuan: Menyamakan ukuran irisan pizza
    </text>
    <text y="152" text-anchor="middle" font-size="14" font-weight="800" fill="#B45309">
      (Common Denominator)
    </text>
  </g>

  <!-- Card 2: Langkah 2 (FPB) -->
  <g transform="translate(920, 290)">
    <rect x="-240" y="-180" width="480" height="360" rx="28" fill="#ECFDF5" stroke="#10B981" stroke-width="3.5" filter="url(#shadow)"/>
    
    <!-- Step Badge -->
    <rect x="-200" y="-160" width="400" height="44" rx="14" fill="#10B981"/>
    <text y="-132" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900">
      🟢 LANGKAH 2: DI AKHIR SOAL
    </text>

    <!-- Condition -->
    <text y="-80" text-anchor="middle" font-size="16" font-weight="800" fill="#065F46">
      ❓ KONDISI:
    </text>
    <rect x="-180" y="-60" width="360" height="42" rx="10" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text y="-34" text-anchor="middle" font-size="16" font-weight="900" fill="#047857">
      Hasil Akhir Angkanya Masih Besar!
    </text>

    <!-- Action Arrow -->
    <text y="15" text-anchor="middle" font-size="28" fill="#10B981">⬇️</text>
    <rect x="-180" y="35" width="360" height="54" rx="16" fill="#059669" filter="url(#glowGreen)"/>
    <text y="69" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">
      👉 PANGGIL FPB!
    </text>

    <!-- Goal -->
    <text y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065F46">
      Tujuan: Menyederhanakan pecahan
    </text>
    <text y="152" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">
      ke bentuk paling ramping!
    </text>
  </g>

  <!-- Bottom Interactive Game Portal Banner -->
  <g transform="translate(640, 580)">
    <rect x="-480" y="-60" width="960" height="110" rx="28" fill="url(#shadow)" opacity="0.1"/>
    <rect x="-480" y="-60" width="960" height="110" rx="28" fill="#4F46E5" stroke="#818CF8" stroke-width="3" filter="url(#shadow)"/>
    
    <text y="-20" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="900" letter-spacing="1">
      🎮 BUKA WEBSITE GAME MISHKA (GRID 1–100) 🎮
    </text>
    <text y="10" text-anchor="middle" fill="#C7D2FE" font-size="15" font-weight="700">
      Mulai Petualangan: Cek Perasaan (Mood Check-in), Kuas Grid KPK, &amp; Simulator FPB
    </text>
    
    <!-- Direct URL link badge -->
    <rect x="-240" y="24" width="480" height="32" rx="10" fill="#312E81"/>
    <text y="45" text-anchor="middle" fill="#A5B4FC" font-size="13" font-weight="800">
      tiara-dwi.github.io/pkbm-games/math/mishka.html
    </text>
  </g>
</svg>