<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Shan: Tantangan Kuis Kilat 5W+1H & Fakta</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .energy-bar-wrap { height: 10px; background: #FEE2E2; border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .energy-bar-fill { height: 100%; background: linear-gradient(90deg, #EF4444, #F59E0B); width: 100%; transition: width 0.3s; }
    .badge-streak { background: #FEF2F2; color: #DC2626; border: 2px solid #FCA5A5; padding: 6px 14px; border-radius: 20px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="../index.html" class="logo-badge">
      <div class="badge-icon" style="background:#DC2626;">🏆</div>
      <div>Kuis Kilat Shan</div>
    </a>
    <div class="student-tag" style="background:#FEF2F2; color:#DC2626;">Kelas 6 • Shan</div>
    <div class="lang-toggle-container" style="margin-left: auto; margin-right: 12px;">
      <button class="lang-toggle-btn active" title="Bahasa Indonesia">🇮🇩 ID</button>
      <button class="lang-toggle-btn lang-en" onclick="window.location.href='../english/shan.html'" title="Switch to English Game">🇬🇧 EN</button>
    </div>

    <a href="../index.html" class="btn-back">← Menu Utama</a>
  </div>

  <div class="container">
    <div class="tracker-bar">
      <div class="badge-streak">🔥 Kombo: <span id="streak-num">0</span></div>
      <div class="star-count" style="color:#DC2626;">⭐ Skor: <span id="score-display">0</span>/5</div>
    </div>

    <div class="energy-bar-wrap">
      <div class="energy-bar-fill" id="progress-fill"></div>
    </div>

    <div class="challenge-card" id="quiz-card">
      <div class="challenge-question" id="question-text">Loading...</div>
      <div class="option-grid" id="options-container"></div>
      <div class="feedback-box" id="feedback-box"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn-action" id="next-btn" style="display:none; background:#DC2626;" onclick="nextQuestion()">Tantangan Berikutnya ⚡</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-card">
      <div style="font-size: 3.8rem; margin-bottom: 12px;">🥇 🏆 ⚡</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;">Juara Sprint, Shan!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;">
        Kecepatan dan ketepatan analisismu dalam menuntaskan kuis 5W+1H Tanjung Puting sungguh luar biasa!
      </p>
      <a href="../index.html" class="btn-action" style="margin: 0 auto; background:#DC2626;">Kembali ke Menu Kelas</a>
    </div>
  </div>

  <script src="../assets/game.js"></script>
  <script>
    const questions = [
      {
        q: "Dalam teks eksplanasi ilmiah 'Jeda untuk Iklim', apakah faktor SEBAB utama kenaikan suhu bumi?",
        opts: ["Emisi gas rumah kaca dari pembakaran bahan bakar fosil dan industri", "Menanam terlalu banyak pohon di hutan", "Penggunaan sepeda ontel di jalan raya"],
        correct: 0,
        exp: "Aktivitas pembakaran bahan bakar fosil melepaskan gas rumah kaca yang memerangkap panas matahari."
      },
      {
        q: "Manakah AKIBAT nyata dari pemanasan global terhadap kutub bumi?",
        opts: ["Es abadi di kutub mencair lebih cepat dan permukaan air laut naik", "Suhu kutub menjadi semakin dingin membeku", "Daratan es kutub bertambah luas"],
        correct: 0,
        exp: "Pencairan lapisan es kutub dan kenaikan air laut adalah akibat langsung pemanasan global."
      },
      {
        q: "Ciri khas kalimat penjelas dalam teks eksplanasi sebab-akibat adalah...",
        opts: ["Menjelaskan proses ilmiah mengapa dan bagaimana suatu peristiwa terjadi", "Menceritakan kisah dongeng putri kerajaan masa lalu", "Menyajikan naskah lelucon komedi"],
        correct: 0,
        exp: "Teks eksplanasi berfokus membedah alasan logis dan kronologis terjadinya peristiwa alam."
      },
      {
        q: "Manakah tindakan nyata gerakan 'Jeda untuk Iklim' yang bisa diterapkan langsung di sekolah?",
        opts: ["Mematikan lampu dan kipas angin saat ruang kelas kosong", "Membiarkan keran air mengalir sepanjang hari", "Membakar sampah plastik di halaman sekolah"],
        correct: 0,
        exp: "Hemat listrik mengurangi beban emisi pembangkit energi berbahan bakar fosil."
      },
      {
        q: "Manakah kalimat berikut yang merupakan contoh kalimat PERSUASIF (ajakan) aksi iklim?",
        opts: ["Bumi kita sedang demam, mari lakukan aksi nyata hemat energi mulai hari ini!", "Bumi adalah planet ketiga dalam tata surya.", "Suhu udara siang ini terukur 32 derajat Celcius."],
        correct: 0,
        exp: "Kalimat persuasif mengandung kata ajakan (mari, ayo) dan bertujuan membujuk pembaca melakukan aksi nyata."
      }
    ];

    let qIdx = 0;
    let score = 0;
    let streak = 0;

    function renderQuestion() {
      const q = questions[qIdx];
      document.getElementById('question-text').innerText = `${qIdx + 1}. ${q.q}`;
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}.</span> ${opt}`;
        btn.onclick = () => chooseAnswer(idx);
        container.appendChild(btn);
      });
      document.getElementById('progress-fill').style.width = `${((qIdx + 1) / questions.length) * 100}%`;
    }

    function chooseAnswer(idx) {
      const q = questions[qIdx];
      const buttons = document.querySelectorAll('.btn-option');
      const feedback = document.getElementById('feedback-box');
      buttons.forEach(b => b.disabled = true);

      if (idx === q.correct) {
        playSfx('correct');
        buttons[idx].classList.add('selected-correct');
        score++;
        streak++;
        document.getElementById('score-display').innerText = score;
        document.getElementById('streak-num').innerText = streak;
        playSfx('star');
        feedback.className = "feedback-box show correct";
        feedback.innerHTML = `⚡ KILAT & BENAR! ${q.exp}`;
      } else {
        playSfx('wrong');
        buttons[idx].classList.add('selected-wrong');
        streak = 0;
        document.getElementById('streak-num').innerText = streak;
        feedback.className = "feedback-box show wrong";
        feedback.innerHTML = `❌ Jawaban tepat: ${q.opts[q.correct]}`;
      }
      document.getElementById('next-btn').style.display = 'inline-flex';
    }

    function nextQuestion() {
      playSfx('click');
      qIdx++;
      if (qIdx < questions.length) {
        document.getElementById('feedback-box').className = "feedback-box";
        document.getElementById('next-btn').style.display = "none";
        renderQuestion();
      } else {
        triggerGameOutcome(score, 5, "Shan");
      }
    }

    renderQuestion();
  </script>

  <!-- PKBM Universal Remote Telemetry & Live Sync Engine -->
  <script src="../assets/js/pkbm_sync.js"></script>
</body>
</html>
